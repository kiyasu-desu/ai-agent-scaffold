ai:
  agent:
    config:
      tables:
        weatherAgent:
          app-name: weatherAgent
          agent:
            agent-id: 100002
            agent-name: 天气查询智能体
            agent-desc: 根据用户输入的城市，查询该城市当前天气
          module:
            ai-api:
              base-url: https://api.deepseek.com
              api-key: ${DEEPSEEK_API_KEY}
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: deepseek-v4-flash
              tool-mcp-list:
                - stdio:
                    name: weather
                    request-timeout: 30
                    server-parameters:
                      command: "D:\\miniconda\\python.exe"
                      args:
                        - -m
                        - mcp_weather_server
            agents:
              - name: WeatherAgent
                description: Queries current weather for a given city.
                instruction: |
                  You are a weather assistant. When the user asks about the current weather for a city:
                  1. Identify the city from the user's request; if it is a Chinese city name, convert it to English (e.g. 北京 -> Beijing, 上海 -> Shanghai).
                  2. Call the get_current_weather tool with the city name to fetch current weather data.
                  3. Summarize the result in clear Chinese, including temperature, feels-like temperature, humidity, wind, precipitation and UV index when available.
                  4. If the tool call fails, tell the user politely that weather data cannot be retrieved.
                  Output only the final weather summary.
                output-key: weather_info
            runner:
              agent-name: WeatherAgent