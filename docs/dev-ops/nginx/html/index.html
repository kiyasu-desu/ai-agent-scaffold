<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI 智能体 · 对话</title>
    <script src="./config.js"></script>
    <style>
        :root {
            --primary: #4f7cff;
            --primary-2: #7c5cff;
            --accent: #22d3ee;
            --bg: #070b18;
            --panel: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #e8ecf8;
            --text-dim: #8b93ab;
            --danger: #ff5c7a;
            --success: #34d399;
            --sidebar-w: 264px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }
        ::-webkit-scrollbar-track { background: transparent; }

        .app {
            display: flex;
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(1000px 500px at 85% -10%, rgba(79, 124, 255, 0.10), transparent 60%),
                radial-gradient(800px 420px at -10% 110%, rgba(124, 92, 255, 0.08), transparent 60%),
                var(--bg);
        }

        /* ================= 左侧边栏 ================= */
        .sidebar {
            width: var(--sidebar-w);
            flex: none;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
        }

        .side-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 22px 20px;
        }

        .side-brand .badge {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 6px 20px rgba(79, 124, 255, 0.4);
        }

        .side-brand .badge svg { width: 21px; height: 21px; }

        .side-brand .name {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .side-brand .name span {
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .side-nav {
            flex: 1;
            padding: 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .side-nav .nav-label {
            font-size: 11px;
            color: #4a5268;
            padding: 6px 12px 8px;
            letter-spacing: 2px;
        }

        .side-nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 12px;
            border-radius: 11px;
            font-size: 14px;
            color: var(--text-dim);
            text-decoration: none;
            cursor: pointer;
            transition: all .18s ease;
        }

        .side-nav a svg { width: 18px; height: 18px; flex: none; }

        .side-nav a:hover { background: var(--panel); color: var(--text); }

        .side-nav a.active {
            background: linear-gradient(135deg, rgba(79, 124, 255, 0.18), rgba(124, 92, 255, 0.14));
            color: #fff;
            border: 1px solid rgba(79, 124, 255, 0.35);
        }

        .side-user {
            margin: 14px;
            padding: 14px;
            border-radius: 15px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
        }

        .side-user .user-row {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            flex: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 4px 14px rgba(79, 124, 255, 0.35);
        }

        .side-user .user-meta b { display: block; font-size: 14px; }
        .side-user .user-meta span {
            font-size: 11px;
            color: var(--success);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 3px;
        }

        .side-user .user-meta span::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
        }

        .btn-logout {
            width: 100%;
            height: 34px;
            border-radius: 9px;
            border: 1px solid var(--panel-border);
            background: transparent;
            color: var(--text-dim);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all .18s ease;
        }

        .btn-logout svg { width: 14px; height: 14px; }

        .btn-logout:hover {
            color: var(--danger);
            border-color: rgba(255, 92, 122, 0.45);
            background: rgba(255, 92, 122, 0.08);
        }

        /* ================= 主区域 ================= */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            position: relative;
            z-index: 60; /* 置于消息层之上，保证下拉面板不被消息内容遮挡、点击可达 */
            flex: none;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 24px;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(10px);
        }

        .mobile-brand {
            display: none;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
        }

        .mobile-brand .badge {
            width: 32px; height: 32px; border-radius: 9px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
        }

        .mobile-brand .badge svg { width: 18px; height: 18px; }

        /* --- 智能体下拉选择 --- */
        .agent-select { position: relative; }

        .agent-trigger {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 8px 14px 8px 11px;
            border-radius: 13px;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            cursor: pointer;
            transition: all .18s ease;
            min-width: 240px;
            max-width: 380px;
        }

        .agent-trigger:hover { border-color: rgba(79, 124, 255, 0.5); }

        .agent-trigger .agent-ico {
            width: 34px; height: 34px; flex: none;
            border-radius: 10px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(79, 124, 255, 0.18));
            color: #7dd3fc;
        }

        .agent-trigger .agent-ico svg { width: 18px; height: 18px; }

        .agent-trigger .agent-text {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 1px;
            text-align: left;
        }

        .agent-trigger .agent-text .agent-name {
            font-size: 14px; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .agent-trigger .agent-text .agent-desc {
            font-size: 11px; color: var(--text-dim);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .agent-trigger .chev {
            flex: none; width: 15px; height: 15px; color: var(--text-dim);
            transition: transform .2s ease;
        }

        .agent-select.open .chev { transform: rotate(180deg); }

        .agent-panel {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 340px;
            max-height: 380px;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            border: 1px solid var(--panel-border);
            background: #0e1428; /* 完全不透明，避免与消息内容重叠后看不清 */
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            opacity: 0;
            transform: translateY(-6px);
            pointer-events: none;
            transition: all .2s ease;
            z-index: 50;
        }

        .agent-select.open .agent-panel {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .agent-panel .panel-head {
            padding: 13px 16px;
            font-size: 12px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--panel-border);
            letter-spacing: 1px;
        }

        .agent-panel .agent-list { overflow-y: auto; padding: 8px; }

        .agent-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 12px;
            border-radius: 11px;
            cursor: pointer;
            transition: background .15s ease;
        }

        .agent-item:hover { background: rgba(255, 255, 255, 0.05); }

        .agent-item.selected { background: rgba(79, 124, 255, 0.14); }

        .agent-item .dot {
            width: 30px; height: 30px; flex: none;
            border-radius: 9px;
            display: grid; place-items: center;
            background: rgba(34, 211, 238, 0.12);
            color: #7dd3fc;
            font-size: 13px; font-weight: 700;
        }

        .agent-item .item-text { flex: 1; min-width: 0; }
        .agent-item .item-text b {
            display: block; font-size: 13px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .agent-item .item-text p {
            font-size: 11px; color: var(--text-dim); margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .agent-item .check { flex: none; width: 17px; height: 17px; color: var(--primary); display: none; }
        .agent-item.selected .check { display: block; }

        .agent-item .panel-msg {
            padding: 26px 16px;
            text-align: center;
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.9;
        }

        .agent-item .panel-msg button {
            margin-top: 8px;
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid rgba(79, 124, 255, 0.5);
            background: rgba(79, 124, 255, 0.12);
            color: #7ea2ff;
            font-size: 12px;
            cursor: pointer;
        }

        /* --- 头部右侧 --- */
        .header-right { display: flex; align-items: center; gap: 10px; }

        .session-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            font-size: 12px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all .18s ease;
            max-width: 260px;
        }

        .session-chip:hover { border-color: rgba(34, 211, 238, 0.45); color: var(--text); }

        .session-chip svg { flex: none; width: 14px; height: 14px; color: var(--accent); }
        .session-chip code {
            font-family: Consolas, monospace;
            font-size: 11px;
            color: #7dd3fc;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .btn-clear {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            background: var(--panel);
            color: var(--text-dim);
            font-size: 12px;
            cursor: pointer;
            transition: all .18s ease;
        }

        .btn-clear svg { width: 14px; height: 14px; }
        .btn-clear:hover { color: var(--danger); border-color: rgba(255, 92, 122, 0.4); }

        /* ================= 对话区域 ================= */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 28px 24px 12px;
            position: relative;
        }

        .chat-inner {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 100%;
        }

        /* --- 欢迎页 --- */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .orb {
            position: relative;
            width: 96px;
            height: 96px;
            margin-bottom: 30px;
        }

        .orb .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid rgba(34, 211, 238, 0.35);
            animation: orbPulse 3.2s ease-out infinite;
        }

        .orb .ring:nth-child(2) { animation-delay: 1.1s; border-color: rgba(79, 124, 255, 0.3); }
        .orb .ring:nth-child(3) { animation-delay: 2.2s; border-color: rgba(167, 139, 250, 0.28); }

        @keyframes orbPulse {
            0% { transform: scale(0.55); opacity: 1; }
            100% { transform: scale(1.55); opacity: 0; }
        }

        .orb .core {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 32% 28%, rgba(79, 124, 255, 0.9), rgba(124, 92, 255, 0.75) 55%, rgba(34, 211, 238, 0.5));
            box-shadow: 0 0 46px rgba(79, 124, 255, 0.55);
            animation: orbFloat 4s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .orb .core svg { width: 40px; height: 40px; }

        .welcome h1 { font-size: 25px; font-weight: 800; margin-bottom: 10px; letter-spacing: 1px; }
        .welcome h1 em {
            font-style: normal;
            background: linear-gradient(90deg, #60a5fa, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .welcome .hello { font-size: 14px; color: var(--text-dim); margin-bottom: 26px; line-height: 1.8; }

        .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .chips span {
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-dim);
            border: 1px solid var(--panel-border);
            background: var(--panel);
        }

        /* --- 消息 --- */
        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            animation: msgIn .3s ease both;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { flex-direction: row-reverse; }            /* 用户：右侧 */
        .msg-row.ai { flex-direction: row; }                      /* AI：左侧 */

        .msg-row .msg-avatar {
            width: 36px; height: 36px; flex: none;
            border-radius: 50%;
            display: grid; place-items: center;
            color: #fff; font-weight: 700; font-size: 14px;
            margin-top: 2px;
        }

        .msg-row.user .msg-avatar {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 3px 12px rgba(79, 124, 255, 0.35);
        }

        .msg-row.ai .msg-avatar {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            box-shadow: 0 3px 12px rgba(34, 211, 238, 0.35);
        }

        .msg-row.ai .msg-avatar svg { width: 18px; height: 18px; }

        .msg-body { max-width: min(72%, 660px); display: flex; flex-direction: column; }

        .msg-row.user .msg-body { align-items: flex-end; }
        .msg-row.ai .msg-body { align-items: flex-start; }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-row.user .msg-bubble {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-top-right-radius: 5px;
            color: var(--text);
        }

        .msg-row.ai .msg-bubble {
            background: linear-gradient(135deg, rgba(79, 124, 255, 0.22), rgba(124, 92, 255, 0.16));
            border: 1px solid rgba(79, 124, 255, 0.3);
            border-top-left-radius: 5px;
            color: var(--text);
        }

        .msg-row.ai.error .msg-bubble {
            background: rgba(255, 92, 122, 0.1);
            border-color: rgba(255, 92, 122, 0.35);
            color: #ffb3c0;
        }

        .msg-time {
            font-size: 11px;
            color: #4a5268;
            margin-top: 5px;
            padding: 0 4px;
        }

        .msg-row.ai .msg-name {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 5px;
            padding: 0 4px;
        }

        /* --- AI 输入中 --- */
        .typing { display: flex; gap: 5px; padding: 16px 18px; }
        .typing i {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #7ea2ff;
            animation: bounce 1.1s ease-in-out infinite;
        }
        .typing i:nth-child(2) { animation-delay: .15s; }
        .typing i:nth-child(3) { animation-delay: .3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: .5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* --- 回到底部 --- */
        .scroll-bottom {
            position: sticky;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid var(--panel-border);
            background: rgba(16, 22, 40, 0.9);
            color: var(--text-dim);
            cursor: pointer;
            display: none;
            place-items: center;
            margin: 0 auto;
        }

        .scroll-bottom.show { display: grid; }
        .scroll-bottom:hover { color: var(--text); }
        .scroll-bottom svg { width: 16px; height: 16px; }

        /* ================= 输入区 ================= */
        .composer {
            flex: none;
            padding: 10px 24px 16px;
        }

        .composer-inner { max-width: 920px; margin: 0 auto; }

        .composer-box {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 10px 12px 10px 18px;
            border-radius: 18px;
            border: 1px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(10px);
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .composer-box:focus-within {
            border-color: rgba(79, 124, 255, 0.55);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.14);
        }

        .composer-box textarea {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            max-height: 160px;
            padding: 7px 0;
        }

        .composer-box textarea::placeholder { color: #4a5268; }
        .composer-box textarea:disabled { opacity: .55; }

        .btn-send {
            flex: none;
            width: 42px; height: 42px;
            border-radius: 13px;
            border: none;
            cursor: pointer;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 8px 22px rgba(79, 124, 255, 0.4);
            color: #fff;
            transition: transform .15s ease, opacity .2s ease;
        }

        .btn-send:hover { transform: translateY(-2px); }
        .btn-send:active { transform: translateY(0); }
        .btn-send:disabled { opacity: .55; cursor: not-allowed; transform: none; }
        .btn-send svg { width: 18px; height: 18px; }

        .btn-send .spin {
            width: 16px; height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .composer-hint {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 6px 0;
            font-size: 11px;
            color: #4a5268;
        }

        /* --- Toast --- */
        .toast {
            position: fixed;
            top: 84px;
            left: 50%;
            transform: translate(-50%, -12px);
            padding: 10px 20px;
            border-radius: 11px;
            background: rgba(16, 22, 40, 0.96);
            border: 1px solid var(--panel-border);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
            font-size: 13px;
            color: var(--text);
            opacity: 0;
            pointer-events: none;
            transition: all .25s ease;
            z-index: 100;
        }

        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ================= 响应式 ================= */
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .mobile-brand { display: flex; }
            .agent-trigger { min-width: 180px; max-width: 240px; }
            .msg-body { max-width: 82%; }
            .session-chip { max-width: 140px; }
            .btn-clear span { display: none; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- ================= 左侧边栏 ================= -->
    <aside class="sidebar">
        <div class="side-brand">
            <div class="badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="7" width="14" height="12" rx="3"/>
                    <circle cx="12" cy="13" r="2.6" fill="#fff" stroke="none"/>
                    <path d="M12 7V4.5M12 21.5V19M8.4 8.4 6.8 6.8M15.6 8.4l1.6-1.6M8.4 17.6l-1.6 1.6M15.6 17.6l1.6 1.6"/>
                </svg>
            </div>
            <div class="name">AI <span>Agent</span> 工作台</div>
        </div>

        <nav class="side-nav">
            <div class="nav-label">MENU</div>
            <a class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a8 8 0 0 1-8 8H5l-1.5 2L4 14a8 8 0 1 1 17-2z"/>
                </svg>
                智能对话
            </a>
            <a data-toast="智能体中心建设中">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="7" width="14" height="12" rx="3"/>
                    <circle cx="12" cy="13" r="2.4"/>
                    <path d="M12 7V4.5M12 19v2.5M8.4 8.4 6.8 6.8M15.6 8.4l1.6-1.6M8.4 17.6l-1.6 1.6M15.6 17.6l1.6 1.6"/>
                </svg>
                智能体中心
            </a>
            <a data-toast="会话记录建设中">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8v4l2.5 2.5"/>

                会话记录

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
                </svg>
                设置
            </a>
        </nav>

        <div class="side-user">
            <div class="user-row">
                <div class="avatar" id="userAvatar">A</div>
                <div class="user-meta">
                    <b id="userName">--</b>
                    <span>已登录</span>
                </div>
            </div>
            <button class="btn-logout" id="btnLogout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                </svg>
                退出登录
            </button>
        </div>
    </aside>

    <!-- ================= 主区域 ================= -->
    <main class="main">
        <header class="chat-header">
            <div class="mobile-brand">
                <div class="badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="7" width="14" height="12" rx="3"/>
                        <circle cx="12" cy="13" r="2.6" fill="#fff" stroke="none"/>
                        <path d="M12 7V4.5M12 19v2.5"/>
                    </svg>
                </div>
                AI Agent 工作台
            </div>

            <!-- 智能体下拉选择 -->
            <div class="agent-select" id="agentSelect">
                <button type="button" class="agent-trigger" id="agentTrigger">
                    <span class="agent-ico">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="7" width="14" height="12" rx="3"/>
                            <circle cx="12" cy="13" r="2.4"/>
                            <path d="M12 7V4.5M12 19v2.5M8.4 8.4 6.8 6.8M15.6 8.4l1.6-1.6"/>
                        </svg>
                    </span>
                    <span class="agent-text">
                        <span class="agent-name" id="agentName">加载中...</span>
                        <span class="agent-desc" id="agentDesc">正在获取智能体列表</span>
                    </span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </button>
                <div class="agent-panel" id="agentPanel">
                    <div class="panel-head">选择智能体</div>
                    <div class="agent-list" id="agentList"></div>
                </div>

            <div class="header-right">
                <div class="session-chip" id="sessionChip" title="点击复制会话ID">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="3"/>
                        <path d="M9 9h6M9 13h6M9 17h4"/>
                    </svg>
                    <span>会话</span>
                    <code id="sessionIdText">--</code>
                </div>
                <button class="btn-clear" id="btnClear" title="清空对话">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>
                    </svg>
                    <span>清空对话</span>
                </button>
            </div>
        </header>

        <section class="chat-area" id="chatArea">
            <div class="chat-inner" id="chatInner">
                <div class="welcome" id="welcome">
                    <div class="orb">
                        <span class="ring"></span>
                        <span class="ring"></span>
                        <span class="ring"></span>
                        <div class="core">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="5" y="7" width="14" height="12" rx="3"/>
                                <circle cx="12" cy="13" r="2.4" fill="#fff" stroke="none"/>
                                <path d="M12 7V4.5M12 19v2.5"/>
                            </svg>
                        </div>
                    </div>
                    <h1>你好，<em id="helloUser">朋友</em> 👋</h1>
                    <p class="hello">
                        我是你的 AI 智能体助手<br/>请在顶部选择智能体，然后开始我们的对话吧
                    </p>
                    <div class="chips">
                        <span>多模型编排</span>
                        <span>工具调用</span>
                        <span>记忆上下文</span>
                        <span>工作流引擎</span>
                    </div>
                </div>

                <button class="scroll-bottom" id="scrollBottom" title="回到底部">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M19 12l-7 7-7-7"/>
                    </svg>
                </button>
            </div>
        </section>

        <footer class="composer">
            <div class="composer-inner">
                <div class="composer-box">
                    <textarea id="messageInput" rows="1" placeholder="输入你的问题，Enter 发送，Shift + Enter 换行"></textarea>
                    <button class="btn-send" id="btnSend" title="发送">
                        <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="composer-hint">
                    <span>Enter 发送 · Shift + Enter 换行</span>
                    <span id="composerAgent">未选择智能体</span>
                </div>
            </div>
        </footer>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    (function () {
        'use strict';

        /* ================= 配置 ================= */
        const CONFIG = window.AI_AGENT_CONFIG || {
            API_BASE_URL: 'http://127.0.0.1:8091',
            API: {
                QUERY_AGENT_CONFIG_LIST: '/api/v1/query_ai_agent_config_list',
                CREATE_SESSION: '/api/v1/create_session',
                CHAT: '/api/v1/chat'
            },
            COOKIE: { TOKEN: 'ai_agent_token', USER: 'ai_agent_user' },
            PAGES: { LOGIN: './login.html', INDEX: './index.html' },
            SUCCESS_CODE: '0000'
        };

        /* ================= 登录态校验 =================
         * 未检测到登录 Cookie 时，跳转到登录页 */
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
            if (!m) return null;
            try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
        }

        const TOKEN = getCookie(CONFIG.COOKIE.TOKEN);
        const USER_ID = getCookie(CONFIG.COOKIE.USER);   // 登录的用户ID，作为会话/对话参数

        if (!USER_ID || !TOKEN) {
            window.location.replace(CONFIG.PAGES.LOGIN || './login.html');
            return;
        }

        /* ================= DOM ================= */
        const $ = function (id) { return document.getElementById(id); };
        const chatInner = $('chatInner');
        const chatArea = $('chatArea');
        const welcome = $('welcome');
        const messageInput = $('messageInput');
        const btnSend = $('btnSend');
        const sendIcon = $('sendIcon');
        const agentSelect = $('agentSelect');
        const agentTrigger = $('agentTrigger');
        const agentPanel = $('agentPanel');
        const agentList = $('agentList');
        const agentNameEl = $('agentName');
        const agentDescEl = $('agentDesc');
        const sessionIdText = $('sessionIdText');
        const composerAgent = $('composerAgent');
        const toastEl = $('toast');

        /* ================= 状态 ================= */
        let agents = [];
        let currentAgentId = null;   // 下拉选择的 agentId
        let sessionId = null;        // createSession 返回的会话ID
        let sending = false;
        let toastTimer = null;

        /* ================= 用户信息渲染 ================= */
        $('userName').textContent = USER_ID;
        $('userAvatar').textContent = USER_ID.charAt(0).toUpperCase();
        $('helloUser').textContent = USER_ID;

        /* ================= Toast ================= */
        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toastEl.classList.remove('show');
            }, 2200);
        }

        /* ================= 接口请求 ================= */
        async function api(path, method, body) {
            const resp = await fetch(CONFIG.API_BASE_URL + path, {
                method: method || 'GET',
                headers: { 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined
            });
            if (!resp.ok) {
                throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
            }
            return resp.json();
        }

        /* ================= 智能体列表 ================= */
        async function loadAgents() {
            agentNameEl.textContent = '加载中...';
            agentDescEl.textContent = '正在获取智能体列表';
            agentList.innerHTML = '';

            const loading = document.createElement('div');
            loading.className = 'agent-item';
            loading.innerHTML = '<div class="panel-msg">正在加载智能体列表...</div>';
            agentList.appendChild(loading);

            try {
                const res = await api(CONFIG.API.QUERY_AGENT_CONFIG_LIST, 'GET');
                if (res.code !== CONFIG.SUCCESS_CODE) {
                    throw new Error(res.info || '查询智能体列表失败');
                }
                agents = (res.data || []).filter(function (a) { return a.agentId; });

                if (agents.length === 0) {
                    throw new Error('暂无可用智能体');
                }

                renderAgentList();
                // 默认选中第一个智能体
                if (!currentAgentId) {
                    selectAgent(agents[0].agentId, false);
                } else {
                    // 若当前选择不在列表内，回退到第一个
                    const exists = agents.some(function (a) { return a.agentId === currentAgentId; });
                    if (!exists) selectAgent(agents[0].agentId, false);
                    else selectAgent(currentAgentId, false);
                }
            } catch (e) {
                agents = [];
                agentNameEl.textContent = '加载失败';
                agentDescEl.textContent = '点击重试';
                agentList.innerHTML = '';
                const err = document.createElement('div');
                err.className = 'agent-item';
                err.innerHTML = '<div class="panel-msg">智能体列表获取失败<br/>请确认后端服务已启动（' +
                    CONFIG.API_BASE_URL + '）<br/><button id="retryBtn">重新加载</button></div>';
                agentList.appendChild(err);
                const retryBtn = document.getElementById('retryBtn');
                if (retryBtn) {
                    retryBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        loadAgents();
                    });
                }
            }
        }

        function renderAgentList() {
            agentList.innerHTML = '';
            agents.forEach(function (agent) {
                const item = document.createElement('div');
                item.className = 'agent-item' + (agent.agentId === currentAgentId ? ' selected' : '');
                item.dataset.agentId = agent.agentId;

                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.textContent = (agent.agentName || agent.agentId).charAt(0).toUpperCase();

                const text = document.createElement('div');
                text.className = 'item-text';
                const name = document.createElement('b');
                name.textContent = agent.agentName || agent.agentId;
                const desc = document.createElement('p');
                desc.textContent = agent.agentDesc || '暂无描述';
                text.appendChild(name);
                text.appendChild(desc);

                const check = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                check.setAttribute('viewBox', '0 0 24 24');
                check.setAttribute('fill', 'none');
                check.setAttribute('stroke', 'currentColor');
                check.setAttribute('stroke-width', '2.4');
                check.setAttribute('stroke-linecap', 'round');
                check.setAttribute('stroke-linejoin', 'round');
                check.classList.add('check');
                const checkPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                checkPath.setAttribute('d', 'M20 6L9 17l-5-5');
                check.appendChild(checkPath);

                item.appendChild(dot);
                item.appendChild(text);
                item.appendChild(check);

                item.addEventListener('click', function () { selectAgent(agent.agentId); });
                agentList.appendChild(item);
            });
        }

        function selectAgent(agentId, notify) {
            const agent = agents.find(function (a) { return a.agentId === agentId; });
            if (!agent) return;

            currentAgentId = agentId;
            agentNameEl.textContent = agent.agentName || agentId;
            agentDescEl.textContent = agent.agentDesc || '';
            composerAgent.textContent = '当前智能体：' + (agent.agentName || agentId);
            messageInput.placeholder = '和「' + (agent.agentName || agentId) + '」对话，Enter 发送，Shift + Enter 换行';

            agentList.querySelectorAll('.agent-item').forEach(function (el) {
                el.classList.toggle('selected', el.dataset.agentId === agentId);
            });

            closeAgentPanel();
            if (notify !== false) {
                toast('已切换到智能体：' + (agent.agentName || agentId));
            }
        }

        function toggleAgentPanel() {
            agentSelect.classList.toggle('open');
        }

        function closeAgentPanel() {
            agentSelect.classList.remove('open');
        }

        agentTrigger.addEventListener('click', function (e) {
            e.stopPropagation();
            toggleAgentPanel();
        });

        document.addEventListener('click', function (e) {
            if (!agentSelect.contains(e.target)) closeAgentPanel();
        });

        /* ================= 消息渲染 =================
         * 用户消息：右侧   接口返回：左侧 */
        function nowTime() {
            return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function appendMessage(role, content, isError) {
            welcome.style.display = 'none';

            const row = document.createElement('div');
            row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai') + (isError ? ' error' : '');

            // 头像
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            if (role === 'user') {
                avatar.textContent = USER_ID.charAt(0).toUpperCase();
            } else {
                avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                    '<rect x="5" y="7" width="14" height="12" rx="3"/>' +
                    '<circle cx="12" cy="13" r="2.4" fill="currentColor" stroke="none"/>' +
                    '<path d="M12 7V4.5M12 19v2.5"/></svg>';
            }

            const body = document.createElement('div');
            body.className = 'msg-body';

            if (role === 'ai') {
                const name = document.createElement('div');
                name.className = 'msg-name';
                name.textContent = 'AI 智能体' + (isError ? ' · 提示' : '');
                body.appendChild(name);
            }

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = content || '(空回复)';
            body.appendChild(bubble);

            const time = document.createElement('div');
            time.className = 'msg-time';
            time.textContent = nowTime();
            body.appendChild(time);

            row.appendChild(avatar);
            row.appendChild(body);

            chatInner.insertBefore(row, chatInner.lastElementChild);
            scrollToBottom(true);
            return row;
        }

        /* --- AI 输入中动画 --- */
        function showTyping() {
            const row = document.createElement('div');
            row.className = 'msg-row ai';
            row.id = 'typingRow';

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                '<rect x="5" y="7" width="14" height="12" rx="3"/>' +
                '<circle cx="12" cy="13" r="2.4" fill="currentColor" stroke="none"/>' +
                '<path d="M12 7V4.5M12 19v2.5"/></svg>';

            const body = document.createElement('div');
            body.className = 'msg-body';
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble typing';
            bubble.innerHTML = '<i></i><i></i><i></i>';
            body.appendChild(bubble);

            row.appendChild(avatar);
            row.appendChild(body);
            chatInner.insertBefore(row, chatInner.lastElementChild);
            scrollToBottom(true);
        }

        function removeTyping() {
            const row = document.getElementById('typingRow');
            if (row) row.remove();
        }

        /* ================= 滚动控制 ================= */
        const scrollBottomBtn = $('scrollBottom');

        function isNearBottom() {
            return chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight < 120;
        }

        function scrollToBottom(force) {
            if (force || isNearBottom()) {
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        }

        chatArea.addEventListener('scroll', function () {
            scrollBottomBtn.classList.toggle('show', !isNearBottom());
        });

        scrollBottomBtn.addEventListener('click', function () {
            chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
        });

        /* ================= 会话与对话 ================= */
        function updateSessionBadge(id) {
            sessionId = id;
            sessionIdText.textContent = id || '--';
            sessionIdText.title = id || '';
        }

        $('sessionChip').addEventListener('click', function () {
            if (!sessionId) {
                toast('暂无会话ID，发送消息后自动创建');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(sessionId).then(function () {
                    toast('会话ID已复制');
                }).catch(function () { toast('复制失败'); });
            } else {
                toast('会话ID：' + sessionId);
            }
        });

        function setSending(state) {
            sending = state;
            btnSend.disabled = state;
            messageInput.disabled = state;
            if (state) {
                sendIcon.style.display = 'none';
                const spin = document.createElement('span');
                spin.className = 'spin';
                spin.id = 'sendSpin';
                btnSend.appendChild(spin);
            } else {
                sendIcon.style.display = '';
                const spin = document.getElementById('sendSpin');
                if (spin) spin.remove();
                messageInput.focus();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (sending) return;

            if (!currentAgentId) {
                toast('请先在顶部选择智能体');
                return;
            }
            if (!message) {
                toast('请输入提问内容');
                messageInput.focus();
                return;
            }

            setSending(true);
            messageInput.value = '';
            autoResize();
            welcome.style.display = 'none';

            // 用户提问渲染到左侧
            appendMessage('user', message);
            showTyping();

            try {
                /* 1. 每次发起对话，先创建会话，获取会话ID */
                const sessionRes = await api(CONFIG.API.CREATE_SESSION, 'POST', {
                    agentId: currentAgentId,
                    userId: USER_ID
                });
                if (sessionRes.code !== CONFIG.SUCCESS_CODE) {
                    throw new Error(sessionRes.info || '创建会话失败');
                }
                const sid = sessionRes.data && sessionRes.data.sessionId;
                if (!sid) throw new Error('会话ID为空');
                updateSessionBadge(sid);

                /* 2. 调用会话服务：agentId + userId + sessionId + message */
                const chatRes = await api(CONFIG.API.CHAT, 'POST', {
                    agentId: currentAgentId,
                    userId: USER_ID,
                    sessionId: sid,
                    message: message
                });
                if (chatRes.code !== CONFIG.SUCCESS_CODE) {
                    throw new Error(chatRes.info || '对话失败');
                }

                removeTyping();
                // 接口返回渲染到右侧
                appendMessage('ai', (chatRes.data && chatRes.data.content) || '', false);
            } catch (e) {
                removeTyping();
                appendMessage('ai', '请求失败：' + (e && e.message ? e.message : e), true);
            } finally {
                setSending(false);
            }
        }

        /* ================= 输入框交互 ================= */
        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
        }

        messageInput.addEventListener('input', autoResize);

        messageInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
                e.preventDefault();
                sendMessage();
            }
        });

        btnSend.addEventListener('click', sendMessage);

        /* ================= 清空对话 ================= */
        $('btnClear').addEventListener('click', function () {
            chatInner.querySelectorAll('.msg-row').forEach(function (el) { el.remove(); });
            welcome.style.display = '';
            updateSessionBadge(null);
            toast('对话已清空');
        });

        /* ================= 退出登录 ================= */
        $('btnLogout').addEventListener('click', function () {
            document.cookie = CONFIG.COOKIE.TOKEN + '=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';
            document.cookie = CONFIG.COOKIE.USER + '=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';
            window.location.href = CONFIG.PAGES.LOGIN || './login.html';
        });

        /* ================= 侧边栏占位菜单 ================= */
        document.querySelectorAll('.side-nav a[data-toast]').forEach(function (a) {
            a.addEventListener('click', function () {
                toast(a.getAttribute('data-toast'));
            });
        });

        /* ================= 初始化 ================= */
        loadAgents();
        messageInput.focus();
    })();
</script>
</body>
